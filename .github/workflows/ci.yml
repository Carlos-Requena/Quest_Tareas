# CI de Quests: puerta de la fase 1.5 («CI verde en ambos sistemas»).
# En macOS y Windows: tipos, tests, build del frontend y de la app de Tauri; en macOS, además, la documentación.
# Los instaladores quedan como artefactos del run (sin firmar), para probarlos a mano.
name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      # Documentación: tablas generadas al día, README con su plantilla, enlaces y eventos
      # que existen (scripts/docs.mjs). No depende del sistema: basta con uno.
      - name: Documentación
        if: runner.os == 'macOS'
        run: pnpm docs:check

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Sin tagName, tauri-action solo compila (pnpm build + cargo) y empaqueta.
      # La credencial de Google (sincronización, features/sync) sale de los secretos del
      # repositorio; sin ellos, la app se compila igual con la sincronización «sin configurar».
      - name: Build de la app
        uses: tauri-apps/tauri-action@v0
        env:
          QUESTS_GOOGLE_CLIENT_ID: ${{ secrets.QUESTS_GOOGLE_CLIENT_ID }}
          QUESTS_GOOGLE_CLIENT_SECRET: ${{ secrets.QUESTS_GOOGLE_CLIENT_SECRET }}

      - uses: actions/upload-artifact@v7
        with:
          name: quests-${{ matrix.name }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
