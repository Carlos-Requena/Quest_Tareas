[package]
name = "quests"
version = "0.1.0"
description = "Quest Board — tareas como misiones"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quests_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "time", "io-util", "sync"] }
base64 = "0.22"
sha2 = "0.10"
open = "5.4.4"
url = "2.5.8"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "form", "query"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Inicio de sesión de Google en iOS (ASWebAuthenticationSession). En el escritorio no hace nada.
tauri-plugin-web-auth = { path = "plugins/web-auth" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
