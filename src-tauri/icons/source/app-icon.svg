<!-- Icono de Quests: el emblema del Quest Board de la cabecera (components/Header.tsx, Emblem),
     con los colores dorados y el fondo de theme.css. Sin transparencia: iOS pone las esquinas
     redondeadas. Se regeneran todos los tamaños con: pnpm tauri icon src-tauri/icons/source/app-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#2a241c"/>
      <stop offset="0.55" stop-color="#15120e"/>
      <stop offset="1" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2d68f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2d68f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>
  <!-- El emblema de 64 × 64, ampliado ×12,6 y centrado. -->
  <g transform="translate(109 109) scale(12.6)" filter="url(#glow)">
    <rect x="10" y="10" width="44" height="44" transform="rotate(45 32 32)" fill="none" stroke="#d6b25e" stroke-width="1.5"/>
    <rect x="15" y="15" width="34" height="34" transform="rotate(45 32 32)" fill="rgba(214,178,94,.10)" stroke="#8a7038" stroke-width="1"/>
    <rect x="23" y="25" width="18" height="14" rx="1.5" fill="none" stroke="#f2d68f" stroke-width="1.5"/>
    <path d="M27 30h7M27 34h5M36 33.5l2 1.5-2 1.5" stroke="#f2d68f" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
